[project]
name = "warflower"
version = "0.1.0"
description = "Dedi server mgmt"
authors = [{ name = "scott" }]
requires-python = "~=3.8"
readme = "README.md"
dependencies = [
    "docker>=7.0.0,<8",
    "pyyaml>=6.0.1,<7",
    "flask>=3.0.1,<4",
    "flask-httpauth>=4.8.0,<5",
    "setuptools==59.5.0",
    "python-dotenv>=1.0.1,<2",
    "discord-py>=2.3.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
